# Just a dummy file so that the code can actually ran!
# It matches what our resource/index.html has.

[[input]]
variable = "{{fullName}}"
regex = "^[A-Z][a-z]+(\\s[A-Z][a-z]+)*$"

  [[input.test]]
  cases = ["Jonh", "Cena", "What Da"]
  result = [true, true, true]

[[input]]
variable = "{{date}}"
type = "date MM/dd/uuuu"
regex = "[0-9]{2}/[0-9]{2}/[0-9]{4}"

  [[input.test]]
  cases = ["jkahds", "2022/22/22", "11/11/2022", "32/32/2024"]
  result = [false, false, true, false]

